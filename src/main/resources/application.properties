spring.application.name=dmq

spring.datasource.url=${DB_URL_DMQ}
spring.datasource.username=${DB_DMQ_USERNAME}
spring.datasource.password=${DB_DMQ_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP connection pool - keep footprint small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000


server.port=${PORT:8083}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_MAIL_USERNAME}
spring.mail.password=${BREVO_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

dmq.mail.owner-email=${DMQ_OWNER_MAIL}

# All email is sent through Brevo's HTTPS API with this key (xkeysib-...). The spring.mail.* SMTP settings above are no longer used.
dmq.mail.brevo-api-key=${BREVO_API_KEY}

dmq.mail.admin-login-url=${DMQ_ADMIN_LOGIN_URL:https://dmq.schedulers.trade/adminLogin.html}




# Project Tracking Feature Configuration
project.upload.dir=${UPLOAD_DIR:./uploads}
server.servlet.multipart.max-file-size=50MB
server.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/,file:${UPLOAD_DIR:./uploads}/

quotation.pdf-dir=${UPLOAD_DIR:./uploads}/quotations


   # Raised so project videos fit; images and videos each still enforce their own rules.
   spring.servlet.multipart.max-file-size=500MB
   spring.servlet.multipart.max-request-size=500MB
   # Largest single video VideoStorageService accepts.
   dmq.video.max-size-mb=500
   dmq.upload-dir=uploads
