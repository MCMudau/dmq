<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — DMQ Admin</title>
<style>
  :root {
    --dmq-navy: #002f87;
    --dmq-blue: #0a63c9;
    --dmq-yellow: #f9e526;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: #f4f6fb;
    color: #1c2333;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .page h1 {
    font-size: 24px;
    color: var(--dmq-navy);
    margin: 0 0 4px;
  }
  .page .subtitle {
    color: #5b6577;
    font-size: 14.5px;
    margin: 0 0 24px;
  }

  /* ---- Toolbar: search + add ---- */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    stroke: #8a93a6;
  }
  .search-box input {
    width: 100%;
    padding: 11px 12px 11px 36px;
    border: 1px solid #d7dded;
    background: #fff;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--dmq-blue);
    box-shadow: 0 0 0 3px rgba(10, 99, 201, .12);
  }

  .btn {
    font: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 11px 18px;
    border: 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary { background: var(--dmq-navy); color: #fff; }
  .btn-primary:hover { background: #001f5c; }
  .btn-ghost { background: #eef3fb; color: var(--dmq-navy); }
  .btn-ghost:hover { background: #dde5f3; }
  .btn-danger { background: #c62828; color: #fff; }
  .btn-danger:hover { background: #a61f1f; }
  .btn:disabled { opacity: .6; cursor: default; }

  /* ---- Service list: stacked vertical tiles ---- */
  .service-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .service-tile {
    position: relative;
    background: #fff;
    border: 1px solid #e3e8f2;
    border-left: 4px solid var(--dmq-blue);
    padding: 16px 18px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .service-tile:hover {
    box-shadow: 0 6px 18px rgba(0, 47, 135, .08);
    border-left-color: var(--dmq-yellow);
  }
  .service-tile h3 {
    margin: 0 0 4px;
    font-size: 16px;
    color: var(--dmq-navy);
    padding-right: 90px;
  }
  .service-tile p {
    margin: 0;
    font-size: 14px;
    color: #5b6577;
    line-height: 1.5;
    padding-right: 90px;
    white-space: pre-wrap;
  }

  .tile-actions {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 6px;
    opacity: 0;
    visibility: hidden;
    transform: translateX(4px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s ease;
  }
  .service-tile:hover .tile-actions,
  .service-tile:focus-within .tile-actions {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    background: #eef3fb;
    color: var(--dmq-navy);
    cursor: pointer;
  }
  .icon-btn:hover { background: #dde5f3; }
  .icon-btn.delete { color: #c62828; }
  .icon-btn.delete:hover { background: #fde8e8; }
  .icon-btn svg { width: 16px; height: 16px; }

  .empty-state, .loading-state, .error-state {
    text-align: center;
    padding: 48px 16px;
    color: #8a93a6;
    font-size: 14.5px;
  }
  .error-state { color: #c62828; }

  /* ---- Modal ---- */
  .dmq-modal-overlay {
    position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0, 20, 60, .45);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .dmq-modal-overlay.open { display: flex; }
  .dmq-modal {
    width: 100%; max-width: 420px; background: #fff; padding: 24px;
    box-shadow: 0 20px 50px rgba(0, 20, 60, .35); animation: dmq-pop .15s ease-out;
  }
  @keyframes dmq-pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .dmq-modal h2 { margin: 0 0 16px; font-size: 19px; color: var(--dmq-navy); }
  .dmq-modal p { margin: 0 0 22px; font-size: 14.5px; color: #5b6577; line-height: 1.5; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--dmq-navy);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d7dded;
    font: inherit;
    font-size: 14.5px;
    outline: none;
    resize: vertical;
  }
  .field textarea { min-height: 90px; }
  .field input:focus, .field textarea:focus {
    border-color: var(--dmq-blue);
    box-shadow: 0 0 0 3px rgba(10, 99, 201, .12);
  }
  .field-error {
    color: #c62828;
    font-size: 12.5px;
    margin-top: 4px;
    display: none;
  }
  .field-error.visible { display: block; }

  .dmq-modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .form-error {
    background: #fde8e8;
    color: #a61f1f;
    font-size: 13.5px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: none;
  }
  .form-error.visible { display: block; }
</style>
</head>
<body>

<div id="adminNav"></div>

<div class="page">
  <h1>Services</h1>
  <p class="subtitle">Add, edit or remove the services shown to clients.</p>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search services by name…" autocomplete="off">
    </div>
    <button type="button" class="btn btn-primary" id="addServiceBtn">+ Add New Service</button>
  </div>

  <div id="listContainer">
    <div class="loading-state">Loading services…</div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="dmq-modal-overlay" id="serviceModal">
  <div class="dmq-modal" role="dialog" aria-modal="true" aria-labelledby="serviceModalTitle">
    <h2 id="serviceModalTitle">Add New Service</h2>
    <div class="form-error" id="serviceFormError"></div>
    <form id="serviceForm">
      <div class="field">
        <label for="serviceName">Service name</label>
        <input type="text" id="serviceName" maxlength="150" required>
        <div class="field-error" id="serviceNameError">Service name is required.</div>
      </div>
      <div class="field">
        <label for="serviceDescription">Description</label>
        <textarea id="serviceDescription" maxlength="2000" required></textarea>
        <div class="field-error" id="serviceDescriptionError">Description is required.</div>
      </div>
      <div class="dmq-modal-actions">
        <button type="button" class="btn btn-ghost" id="serviceCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="serviceSaveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="dmq-modal-overlay" id="deleteModal">
  <div class="dmq-modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalMsg">
    <h2 id="deleteModalTitle">Are you sure?</h2>
    <p id="deleteModalMsg">This will permanently remove "<span id="deleteServiceName"></span>" from your services list.</p>
    <div class="dmq-modal-actions">
      <button type="button" class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
      <button type="button" class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="scripts/adminNav.js"></script>
<script>
(function () {
  'use strict';

  AdminNav.init({ active: 'services' });

  const listContainer = document.getElementById('listContainer');
  const searchInput = document.getElementById('searchInput');
  const addServiceBtn = document.getElementById('addServiceBtn');

  const serviceModal = document.getElementById('serviceModal');
  const serviceModalTitle = document.getElementById('serviceModalTitle');
  const serviceForm = document.getElementById('serviceForm');
  const serviceNameInput = document.getElementById('serviceName');
  const serviceDescriptionInput = document.getElementById('serviceDescription');
  const serviceNameError = document.getElementById('serviceNameError');
  const serviceDescriptionError = document.getElementById('serviceDescriptionError');
  const serviceFormError = document.getElementById('serviceFormError');
  const serviceCancelBtn = document.getElementById('serviceCancelBtn');
  const serviceSaveBtn = document.getElementById('serviceSaveBtn');

  const deleteModal = document.getElementById('deleteModal');
  const deleteServiceName = document.getElementById('deleteServiceName');
  const deleteCancelBtn = document.getElementById('deleteCancelBtn');
  const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');

  let services = [];
  let editingServiceId = null;   // null => "add" mode
  let deletingServiceId = null;
  let searchDebounce = null;

  // ---- Data loading ----

  function loadServices(search) {
    const url = '/api/admin/services' + (search ? '?search=' + encodeURIComponent(search) : '');
    listContainer.innerHTML = '<div class="loading-state">Loading services…</div>';

    fetch(url, { credentials: 'same-origin' })
      .then((res) => {
        if (res.status === 401) {
          window.location.href = '/adminLogin.html';
          return null;
        }
        if (!res.ok) throw new Error('Failed to load services');
        return res.json();
      })
      .then((data) => {
        if (data === null) return;
        services = data;
        renderList();
      })
      .catch(() => {
        listContainer.innerHTML = '<div class="error-state">Could not load services. Please refresh the page.</div>';
      });
  }

  function renderList() {
    if (!services.length) {
      listContainer.innerHTML = '<div class="empty-state">No services found. Add your first one with the button above.</div>';
      return;
    }

    const html = services.map((service) => `
      <div class="service-tile" data-id="${service.id}">
        <div class="tile-actions">
          <button type="button" class="icon-btn edit-btn" title="Edit" aria-label="Edit ${escapeHtml(service.name)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button type="button" class="icon-btn delete delete-btn" title="Delete" aria-label="Delete ${escapeHtml(service.name)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path><path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </button>
        </div>
        <h3>${escapeHtml(service.name)}</h3>
        <p>${escapeHtml(service.description || '')}</p>
      </div>
    `).join('');

    listContainer.innerHTML = '<div class="service-list">' + html + '</div>';

    listContainer.querySelectorAll('.edit-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.closest('.service-tile').dataset.id);
        openEditModal(id);
      });
    });
    listContainer.querySelectorAll('.delete-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.closest('.service-tile').dataset.id);
        openDeleteModal(id);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // ---- Search ----

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => loadServices(searchInput.value.trim()), 300);
  });

  // ---- Add / Edit modal ----

  function resetForm() {
    serviceForm.reset();
    serviceNameError.classList.remove('visible');
    serviceDescriptionError.classList.remove('visible');
    serviceFormError.classList.remove('visible');
    serviceFormError.textContent = '';
  }

  function openAddModal() {
    editingServiceId = null;
    resetForm();
    serviceModalTitle.textContent = 'Add New Service';
    serviceModal.classList.add('open');
    serviceNameInput.focus();
  }

  function openEditModal(id) {
    const service = services.find((s) => s.id === id);
    if (!service) return;
    editingServiceId = id;
    resetForm();
    serviceModalTitle.textContent = 'Edit Service';
    serviceNameInput.value = service.name;
    serviceDescriptionInput.value = service.description || '';
    serviceModal.classList.add('open');
    serviceNameInput.focus();
  }

  function closeServiceModal() {
    serviceModal.classList.remove('open');
    editingServiceId = null;
  }

  addServiceBtn.addEventListener('click', openAddModal);
  serviceCancelBtn.addEventListener('click', closeServiceModal);
  serviceModal.addEventListener('click', (e) => { if (e.target === serviceModal) closeServiceModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (serviceModal.classList.contains('open')) closeServiceModal();
      if (deleteModal.classList.contains('open')) closeDeleteModal();
    }
  });

  serviceForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const name = serviceNameInput.value.trim();
    const description = serviceDescriptionInput.value.trim();

    let valid = true;
    if (!name) { serviceNameError.classList.add('visible'); valid = false; }
    else { serviceNameError.classList.remove('visible'); }
    if (!description) { serviceDescriptionError.classList.add('visible'); valid = false; }
    else { serviceDescriptionError.classList.remove('visible'); }
    if (!valid) return;

    const isEdit = editingServiceId !== null;
    const url = isEdit ? '/api/admin/services/' + editingServiceId : '/api/admin/services';
    const method = isEdit ? 'PUT' : 'POST';

    serviceSaveBtn.disabled = true;
    serviceFormError.classList.remove('visible');

    fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description })
    })
      .then((res) => {
        if (res.status === 401) {
          window.location.href = '/adminLogin.html';
          return null;
        }
        if (!res.ok) throw new Error('Save failed');
        return res.json();
      })
      .then((data) => {
        if (data === null) return;
        closeServiceModal();
        loadServices(searchInput.value.trim());
      })
      .catch(() => {
        serviceFormError.textContent = 'Could not save this service. Please try again.';
        serviceFormError.classList.add('visible');
      })
      .finally(() => {
        serviceSaveBtn.disabled = false;
      });
  });

  // ---- Delete modal ----

  function openDeleteModal(id) {
    const service = services.find((s) => s.id === id);
    if (!service) return;
    deletingServiceId = id;
    deleteServiceName.textContent = service.name;
    deleteModal.classList.add('open');
    deleteCancelBtn.focus();
  }

  function closeDeleteModal() {
    deleteModal.classList.remove('open');
    deletingServiceId = null;
  }

  deleteCancelBtn.addEventListener('click', closeDeleteModal);
  deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });

  deleteConfirmBtn.addEventListener('click', () => {
    if (deletingServiceId === null) return;
    deleteConfirmBtn.disabled = true;

    fetch('/api/admin/services/' + deletingServiceId, {
      method: 'DELETE',
      credentials: 'same-origin'
    })
      .then((res) => {
        if (res.status === 401) {
          window.location.href = '/adminLogin.html';
          return;
        }
        if (!res.ok && res.status !== 204) throw new Error('Delete failed');
        closeDeleteModal();
        loadServices(searchInput.value.trim());
      })
      .catch(() => {
        alert('Could not delete this service. Please try again.');
      })
      .finally(() => {
        deleteConfirmBtn.disabled = false;
      });
  });

  // ---- Init ----
  loadServices('');
})();
</script>

</body>
</html>
